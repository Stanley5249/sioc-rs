[package]
name = "sioc"
version = "0.1.0"
edition = "2024"
authors = ["Stanley5249 <seer852741@gmail.com>"]
description = "Async Socket.IO client with type-safe event handling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Stanley5249/sioc-rs"
documentation = "https://docs.rs/sioc"
readme = "README.md"
keywords = ["socketio", "websocket", "async", "networking", "realtime"]
categories = ["network-programming", "asynchronous", "web-programming"]

[dependencies]
# Workspace dependencies
sioc-engine.workspace = true
sioc-macros.workspace = true
sioc-socket.workspace = true

bytes.workspace = true
futures-util.workspace = true
miette.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

pin-project = "1.1.11"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
