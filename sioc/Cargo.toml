[package]
name = "sioc"
version = "0.1.0"
edition = "2024"
authors = ["Sioc Contributors"]
description = "High-performance async Socket.IO client for Rust with zero-copy design"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/sioc"
documentation = "https://docs.rs/sioc"
readme = "README.md"
keywords = ["socketio", "websocket", "async", "networking", "realtime"]
categories = ["network-programming", "asynchronous", "web-programming"]

[dependencies]
# Workspace dependencies
bytes.workspace = true
futures-util.workspace = true
miette.workspace = true
pin-project = "1.1.11"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sioc-core.workspace = true
sioc-engine.workspace = true
sioc-macros.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = []
