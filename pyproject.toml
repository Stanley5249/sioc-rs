[project]
name = "sioc-rs"
version = "0.0.0"
description = "Python Socket.IO servers for testing the Rust client"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "python-socketio",
  "ruff",
  "uvicorn",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # copyright notice is not required for examples
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["INP001"]  # standalone scripts, not packages
