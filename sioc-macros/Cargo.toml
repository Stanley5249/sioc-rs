[package]
name = "sioc-macros"
version.workspace = true
edition = "2024"
description = "Procedural macros for Sioc"
documentation = "https://docs.rs/sioc-macros"
repository = "https://github.com/Stanley5249/sioc-rs"
license = "MIT OR Apache-2.0"
keywords = ["codegen", "macros", "procedural-macro", "socketio"]
categories = [
  "development-tools::procedural-macro-helpers",
  "network-programming"
]

[lib]
proc-macro = true

[dependencies]
darling.workspace = true
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
