# A test that runs past 30 seconds is hung, so fail it and name it instead of
# stalling the whole run.
[profile.default]
status-level = "slow"
final-status-level = "fail"
slow-timeout = { period = "10s", terminate-after = 3 }

# CI reports each completed test and repeats failure output in the summary.
# Test selection, concurrency, and timeouts are inherited from default.
[profile.ci]
status-level = "pass"
final-status-level = "flaky"
failure-output = "immediate-final"

[[profile.default.overrides]]
filter = 'binary(e2e)'
slow-timeout = { period = "20s", terminate-after = 6 }
