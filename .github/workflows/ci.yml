name: CI
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NEXTEST_PROFILE: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  deny:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  msrv:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.88 check --locked --workspace --all-targets

  # Later steps run with `!cancelled()` so one failing check does not hide
  # the next one's results.
  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: rustup toolchain install nightly-2026-07-20 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-07-20 fmt --all --check
      - if: ${{ !cancelled() }}
        run: |
          just --fmt --check
          just --fmt --justfile examples/justfile --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  lint-js:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Wait for both checks and propagate either failure.
      - name: Check JavaScript and managed formatting
        run: |
          bunx oxfmt --check &
          fmt_pid=$!
          bunx oxlint &
          lint_pid=$!
          status=0
          wait "$fmt_pid" || status=1
          wait "$lint_pid" || status=1
          exit "$status"

  lint-py:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Prepare the shared environment before the read-only checks run together.
      - run: uv sync --locked
      # Wait for every check, including when another check fails.
      - name: Check Python formatting, lint, and types
        run: |
          uv run --locked ruff format --check &
          fmt_pid=$!
          uv run --locked ruff check --output-format github &
          lint_pid=$!
          uv run --locked pyrefly check --output-format full-text-with-github --min-severity warn &
          types_pid=$!
          status=0
          wait "$fmt_pid" || status=1
          wait "$lint_pid" || status=1
          wait "$types_pid" || status=1
          exit "$status"

  # Reference-server tests share the compiled Rust test binaries.
  test:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: bun install --frozen-lockfile
      - run: cargo nextest run --locked --workspace --all-targets --run-ignored all
      - if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --doc

  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov, cargo-nextest
      - run: cargo llvm-cov nextest --locked --workspace --all-targets --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true

  doc:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --no-deps --workspace --examples
        env:
          RUSTDOCFLAGS: -D warnings

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deny, msrv, lint, lint-js, lint-py, test, doc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo publish -p eioc
      - run: cargo publish -p sioc-macros
      - run: cargo publish -p sioc
      - uses: orhun/git-cliff-action@v4
        with:
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - run: gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
