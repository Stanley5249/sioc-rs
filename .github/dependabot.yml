version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    cooldown:
      default-days: 0
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    cooldown:
      default-days: 0
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /examples/quick-start
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    cooldown:
      default-days: 0
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
