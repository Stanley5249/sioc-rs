[project]
name = "quick-start"
version = "0.1.0"
description = "Quick-start example with Socket.IO server in Python and client in Rust"
requires-python = ">=3.14"
dependencies = [
  "python-socketio",
  "uvicorn",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # copyright notice is not required for examples
]

[tool.ruff.lint.pydocstyle]
convention = "google"
