[workspace]
resolver = "3"
members = ["examples/*", "sioc", "sioc-engine", "sioc-macros", "sioc-socket"]

[workspace.dependencies]
sioc = { path = "./sioc" }
sioc-engine = { path = "./sioc-engine" }
sioc-macros = { path = "./sioc-macros" }
sioc-socket = { path = "./sioc-socket" }

# Async runtime
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"

# Zero-copy buffers
bytes = "1"
bytestring = { version = "1", features = ["serde"] }

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# URL parsing
url = "2"

# HTTP and WebSocket clients
reqwest = { version = "0.13", default-features = false, features = ["charset"] }
tokio-tungstenite = { version = "0.28", features = ["url"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[workspace.metadata.docs.rs]
all-features = true
