[workspace]
resolver = "3"
members = ["examples/*", "eioc", "sioc", "sioc-macros"]

[workspace.dependencies]
sioc = { path = "./sioc", version = "0.1.0" }
eioc = { path = "./eioc", version = "0.1.0" }
sioc-macros = { path = "./sioc-macros", version = "0.1.0" }

# Async runtime
futures-util = "0.3"
pin-project = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"

# HTTP and WebSocket
base64 = "0.22"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset"] }
tokio-tungstenite = { version = "0.29", features = ["url"] }
url = "2"

# Serialization
bytes = "1"
bytestring = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

# Error handling
miette = "7"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Proc-macro utilities
darling = "0.23"
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Utilities
fastrand = "2"

[workspace.metadata.docs.rs]
all-features = true
