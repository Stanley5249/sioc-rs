[workspace]
members = ["sioc-core", "sioc-macros", "sioc", "sioc-engine", "examples/*"]
resolver = "3"

[workspace.dependencies]
sioc = { path = "./sioc" }
sioc-core = { path = "./sioc-core" }
sioc-macros = { path = "./sioc-macros" }
sioc-engine = { path = "./sioc-engine" }

# Async runtime
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Zero-copy buffers
bytes = "1"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# URL parsing
url = "2"

# HTTP and WebSocket clients
reqwest = { version = "0.13", default-features = false }
tokio-tungstenite = { version = "0.28", features = ["url"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[workspace.metadata.docs.rs]
all-features = true
